name: Build & Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # BUILD STEP (adjust as needed)
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # must output to ./dist

      # -------------------------
      # SSH SETUP
      # -------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # -------------------------
      # BACKUP EXISTING FILES
      # -------------------------
      # Do not move the serving index or assets until the full build has reached
      # a private stage. The old job backed up the live files first, and a bad
      # /home/kabba/www symlink made the following rsync fail.
      - name: Inspect real document root and stage release
        id: stage
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          SITE_ROOT="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -e; cd /home/kabba/www; pwd -P' | tail -n 1)"
          case "$SITE_ROOT" in
            /home/kabba/*) ;;
            *) echo "STOP: serving document root did not resolve safely inside /home/kabba"; exit 1 ;;
          esac
          echo "Resolved physical site root: $SITE_ROOT"
          echo "site_root=$SITE_ROOT" >> "$GITHUB_OUTPUT"
          STAGE="/home/kabba/.kabba-sales-release-stage/$GITHUB_SHA"
          echo "stage_root=$STAGE" >> "$GITHUB_OUTPUT"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$STAGE'"
          rsync -az -e "ssh -p $SSH_PORT" dist/ "$SSH_USER@$SSH_HOST:$STAGE/"

      - name: Install staged website with an atomic index swap
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SITE_ROOT: ${{ steps.stage.outputs.site_root }}
          STAGE_ROOT: ${{ steps.stage.outputs.stage_root }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "SITE_ROOT='$SITE_ROOT' STAGE_ROOT='$STAGE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$SITE_ROOT" in /home/kabba/*) ;; *) echo "STOP: unexpected site root"; exit 1 ;; esac
          test -d "$SITE_ROOT"
          test -f "$STAGE_ROOT/index.html"
          test -d "$STAGE_ROOT/assets"
          mkdir -p "$SITE_ROOT/old.backup" "$SITE_ROOT/assets"
          # Keep the last serving index if present; preserve an earlier backup
          # when a previously failed deploy already moved the index out.
          if [ -f "$SITE_ROOT/index.html" ]; then
            cp -p "$SITE_ROOT/index.html" "$SITE_ROOT/old.backup/index.html"
          fi
          # Assets are content-hashed: copy them BEFORE making the new index live.
          rsync -a "$STAGE_ROOT/assets/" "$SITE_ROOT/assets/"
          # Install .htaccess, images, and other static files, without deleting
          # the existing backup or the assets still needed by open browser tabs.
          rsync -a --exclude='index.html' --exclude='assets/' \
            "$STAGE_ROOT/" "$SITE_ROOT/"
          cp -p "$STAGE_ROOT/index.html" "$SITE_ROOT/index.html.new"
          mv -f "$SITE_ROOT/index.html.new" "$SITE_ROOT/index.html"
          test -s "$SITE_ROOT/index.html"
          echo "Website release installed successfully"
          REMOTE
